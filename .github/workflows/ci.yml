name: CI
on: [push, pull_request]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: eco, POSTGRES_PASSWORD: eco, POSTGRES_DB: eco_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://eco:eco@localhost:5432/eco_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      CREDENTIALS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin123!
      SEED_DEMO: '1'
      ENABLE_MOCK_CHANNEL: '1'
      SYNC_SCHEDULER: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run prisma:generate -w @eco/api
      # Migration dosyası yoksa şemadan üret (ilk kurulum); varsa mevcut olanları uygula
      # Şema değiştiyse yeni migration dosyası üret (shadow veritabanı ile mevcut migration'lardan fark alınır)
      - name: Migration üret (şema değiştiyse)
        working-directory: apps/api
        run: |
          if [ ! -d prisma/migrations ]; then
            mkdir -p prisma/migrations/0_init
            npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0_init/migration.sql
            printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          else
            PGPASSWORD=eco psql -h localhost -U eco -d postgres -c 'DROP DATABASE IF EXISTS eco_shadow;' -c 'CREATE DATABASE eco_shadow;'
            npx prisma migrate diff --from-migrations prisma/migrations --shadow-database-url postgresql://eco:eco@localhost:5432/eco_shadow --to-schema-datamodel prisma/schema.prisma --script > /tmp/diff.sql
            if grep -qE '^(CREATE|ALTER|DROP)' /tmp/diff.sql; then
              NAME="$(date -u +%Y%m%d%H%M%S)_auto"
              mkdir -p "prisma/migrations/$NAME" && cp /tmp/diff.sql "prisma/migrations/$NAME/migration.sql"
              echo "Yeni migration: $NAME"; cat /tmp/diff.sql
            fi
          fi
      - run: npm run prisma:deploy -w @eco/api
      - run: npm run db:seed
      - name: Tip kontrolü
        id: typecheck
        run: npm run typecheck 2>&1 | tee /tmp/typecheck.log; test ${PIPESTATUS[0]} -eq 0
      - name: Tip hatalarını yorumla
        if: failure() && steps.typecheck.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '### Tip kontrolü başarısız\n```\n%s\n```\n' "$(grep -E 'error TS' /tmp/typecheck.log | head -40)" > /tmp/tc.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat /tmp/tc.md)" >/dev/null || true
      - run: npm test -w @eco/api -- --json --outputFile=/tmp/unit.json
      - run: npm run test:e2e -w @eco/api -- --json --outputFile=/tmp/e2e.json
      - name: Test özetini commit yorumu olarak yaz
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const fs=require("fs");const rd=f=>{try{return JSON.parse(fs.readFileSync(f,"utf8"))}catch{return null}};
            const u=rd("/tmp/unit.json"),e=rd("/tmp/e2e.json");
            const line=(n,r)=>r?`${n}: ${r.numPassedTests} geçti, ${r.numFailedTests} başarısız`+(r.numFailedTests?"\n"+r.testResults.flatMap(t=>t.assertionResults.filter(a=>a.status==="failed").map(a=>"- "+a.fullName+"\n```\n"+(a.failureMessages||[]).join("\n").slice(0,800)+"\n```")).join("\n"):""):`${n}: çalışmadı`;
            fs.writeFileSync("/tmp/summary.md","### Test sonuçları\n"+line("Birim",u)+"\n"+line("Uçtan uca",e)+"\n");
          '
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat /tmp/summary.md)" >/dev/null || true
      - run: npm run build -w @eco/api
      - run: npm run build -w @eco/web
      - name: Arayüz testleri (Playwright)
        env:
          SYNC_SCHEDULER: 'off'
          API_PORT: '4000'
          RATE_LIMIT_PER_MINUTE: '5000'
          NEXT_PUBLIC_API_URL: http://localhost:4000
          WEB_URL: http://localhost:3000
        run: |
          npx playwright install --with-deps chromium
          ls apps/api/dist | head; (cd apps/api && node dist/main.js > /tmp/api.log 2>&1 &)
          (cd apps/web && cp -r .next/static .next/standalone/apps/web/.next/ && cp -r public .next/standalone/apps/web/ 2>/dev/null; cd .next/standalone && PORT=3000 HOSTNAME=0.0.0.0 node apps/web/server.js > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:4000/api/v1/health >/dev/null && curl -sf http://localhost:3000/giris >/dev/null && break; sleep 2; done
          curl -sf http://localhost:4000/api/v1/health || (cat /tmp/api.log; exit 1)
          curl -sf http://localhost:3000/giris >/dev/null || (cat /tmp/web.log; exit 1)
          npm run test:ui -w @eco/web 2>&1 | tee /tmp/ui.log; test ${PIPESTATUS[0]} -eq 0
      - name: Arayüz logları (hata durumunda)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { printf '### Arayüz adımı logları\n```\n'; tail -c 1500 /tmp/ui.log 2>/dev/null || true; for f in $(ls apps/web/test-results/*/error-context.md 2>/dev/null | head -3); do printf '\n--- %s ---\n' "$f"; sed -n '/# Error details/,/# Page snapshot/p' "$f" | head -c 700; done; printf '\n--- api.log ---\n'; tail -c 1200 /tmp/api.log 2>/dev/null || true; printf '\n--- web.log ---\n'; tail -c 800 /tmp/web.log 2>/dev/null || true; printf '\n```\n'; } > /tmp/uilog.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat /tmp/uilog.md)" >/dev/null || true
      - name: Arayüz test özeti
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const fs=require("fs");let r=null;try{r=JSON.parse(fs.readFileSync("/tmp/ui.json","utf8"))}catch{}
            if(!r){fs.writeFileSync("/tmp/ui.md","Arayüz: çalışmadı\n");process.exit(0)}
            const all=[];const walk=s=>{(s.specs||[]).forEach(sp=>all.push(sp));(s.suites||[]).forEach(walk)};r.suites.forEach(walk);
            const failed=all.filter(s=>!s.ok);
            fs.writeFileSync("/tmp/ui.md",`Arayüz (Playwright): ${all.length-failed.length} geçti, ${failed.length} başarısız\n`+failed.map(f=>"- "+f.title+"\n```\n"+((f.tests[0].results[0].error||{}).message||"").slice(0,600)+"\n```").join("\n"));
          '
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat /tmp/ui.md)" >/dev/null || true
      - name: Docker imajları derlenebilir mi
        id: docker
        run: |
          set -o pipefail
          docker build -f infra/api.Dockerfile -t eco-api:ci . 2>&1 | tee /tmp/docker-api.log | tail -5
          docker build -f infra/web.Dockerfile -t eco-web:ci . 2>&1 | tee /tmp/docker-web.log | tail -5
      - name: Docker hata logu
        if: always() && steps.docker.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          { echo '### Docker derleme hatası'; echo '```'; tail -40 /tmp/docker-api.log 2>/dev/null; echo '--- web ---'; tail -40 /tmp/docker-web.log 2>/dev/null; echo '```'; } > /tmp/d.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(head -c 60000 /tmp/d.md)" >/dev/null
          exit 0
      # Üretilen migration ve lock dosyalarını depoya geri yaz (yalnızca main, yalnızca değişiklik varsa)
      - name: Üretilen dosyaları commit et
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/api/prisma/migrations
          if ! git diff --cached --quiet; then
            git commit -m "chore: migration ve package-lock üretildi [skip ci]"
            git push
          fi
