name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: eco, POSTGRES_PASSWORD: eco, POSTGRES_DB: eco_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://eco:eco@localhost:5432/eco_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      CREDENTIALS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with: { name: package-lock, path: package-lock.json }
      - run: npm run prisma:generate -w @eco/api
      - run: npm run prisma:deploy -w @eco/api
      - run: npm run typecheck
      - run: npm test -w @eco/api
      - run: npm run build -w @eco/web
